<!DOCTYPE html>
<html lang="{{ lang }}">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Habibi</title>
		<script>
			// Блокирующий скрипт: применяет тему до первой отрисовки, чтобы не
			// было мигания. Ручной выбор побеждает системный в обе стороны —
			// см. frontend/src/shared/lib/theme.ts.
			(function () {
				try {
					var stored = localStorage.getItem("habibi:theme");
					var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
					document.documentElement.classList.toggle("dark", dark);
				} catch (e) {
					/* localStorage/matchMedia недоступны — остаёмся на светлой теме */
				}
			})();
		</script>
		{% for style in styles %}
		<link rel="stylesheet" href="{{ style }}" />
		{% endfor %}
	</head>
	<body>
		<div id="root"></div>
		<script>
			window.habibi = {{ habibi_boot }};
		</script>
		<script type="module" src="{{ script }}"></script>
	</body>
</html>
